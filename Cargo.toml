[package]
name = "rust-adzan"
version = "1.4.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-icons = "0.1.0"
dirs = "7.0.0"
icu_calendar = "2.3.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = "0.48.1"
rfd = "0.15.4"
rodio = "0.23.0"
salah = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8.1"
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros"] }
ureq = "3"
winreg = "0.56.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true

[build-dependencies]
winresource = "0.1.34"
